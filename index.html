<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Rohith Vittamraj | Full-Stack AI Product Portfolio</title>
    <meta
      name="description"
      content="Explore Rohith Vittamraj's portfolio of full-stack products, AI systems, MERN applications, UX-focused interfaces, certifications, and production-minded engineering work."
    />
    <meta
      name="keywords"
      content="Rohith Vittamraj, Full Stack Developer, AI Product Builder, MERN Developer, React, Node.js, Express, MongoDB, UI UX, Agentic AI, Portfolio"
    />
    <meta name="author" content="Rohith" />
    <meta name="language" content="English" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index,follow" />
    <meta name="revisit-after" content="7 days" />
    <meta name="rating" content="general" />
    <meta name="distribution" content="global" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://rohiths-portfolio.onrender.com/" />
    <link rel="preload" as="image" href="/img_9.webp" fetchpriority="high" />

    <!-- Favicon and Touch Icons -->
    <link rel="apple-touch-icon" href="/LOGO.jpg" />
    <link rel="icon" type="image/jpg" sizes="32x32" href="/LOGO.jpg" />
    <link rel="icon" type="image/jpg" sizes="16x16" href="/LOGO.jpg" />

    <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Rohith Vittamraj | Full-Stack AI Product Portfolio" />
    <meta
      property="og:description"
      content="A premium portfolio showcasing full-stack products, AI projects, interactive interfaces, certifications, and product-minded engineering."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rohiths-portfolio.onrender.com/" />
    <meta property="og:image" content="/LOGO.jpg" />
    <meta property="og:image:alt" content="Rohith's Portfolio Logo" />
    <meta property="og:site_name" content="Rohith's Portfolio" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rohith Vittamraj | Full-Stack AI Product Portfolio" />
    <meta
      name="twitter:description"
      content="Explore full-stack builds, AI systems, MERN applications, UX work, certifications, and practical product engineering by Rohith Vittamraj."
    />
    <meta name="twitter:image" content="/LOGO.jpg" />
    <meta name="twitter:image:alt" content="Rohith's Portfolio Logo" />

    <!-- Structured Data: JSON-LD for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rohith",
        "jobTitle": "Full-Stack Developer and AI Product Builder",
        "url": "https://rohiths-portfolio.onrender.com/",
        "image": "https://rohiths-portfolio.onrender.com/LOGO.jpg",
        "description": "Rohith builds full-stack products, AI systems, MERN applications, and polished user interfaces with a focus on practical product outcomes.",
        "sameAs": [
          "www.linkedin.com/in/rohith-vittamraj-0ab76a313",
          "https://x.com/rohithofficial5?s=21&t=cVo-4UEJaqOqaL-meqeikQ",
          "https://github.com/rohith-2809"
        ]
      }
    </script>

    <!-- Additional Meta Tags for Enhanced SEO and Security -->
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self'; script-src 'self' 'unsafe-inline'; form-action 'self' https://formsubmit.co;" />
    <meta name="theme-color" content="#060A0F" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
